networks:
  cashmind_network:
    driver: bridge
    name: cashmind_network

services:
  cashmind_redis:
    image: redis:7-alpine
    container_name: cashmind_redis
    restart: unless-stopped
    networks:
      - cashmind_network
    volumes:
      - cashmind_redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  cashmind_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cashmind_api
    restart: unless-stopped
    networks:
      - cashmind_network
    env_file: .env
    depends_on:
      - cashmind_redis
    ports:
      - "127.0.0.1:3011:3011"

  cashmind_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    container_name: cashmind_frontend
    restart: unless-stopped
    networks:
      - cashmind_network
    env_file: .env
    depends_on:
      - cashmind_api

  cashmind_nginx:
    image: nginx:alpine
    container_name: cashmind_nginx
    restart: unless-stopped
    networks:
      - cashmind_network
    ports:
      - "0.0.0.0:8002:80"
    volumes:
      - ./nginx/cashmind.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cashmind_frontend
      - cashmind_api

volumes:
  cashmind_redis_data:
